<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="estilos.css">
    <title>estrellitas</title>
  </head>
  <body>
    <div style="text-align: center" class="estrellas">
      <img class="est"  id="e1" src="ev_b.png" alt="" />
      <img class="est"  id="e2" src="ev_b.png" alt="" />
      <img class="est"  id="e3" src="ev_b.png" alt="" />
      <img class="est"  id="e4" src="ev_b.png" alt="" />
      <img class="est"  id="e5" src="ev_b.png" alt="" />
    </div>
    <script
      src="https://code.jquery.com/jquery-3.7.1.min.js"
      integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
      crossorigin="anonymous"
    ></script>
    <script>
      $(document).ready(function () {

        var acu = 0;
        var conta = 0;

        $('.est').on('mouseover',function()
        {
          iluminar(this.id);
        })

        $('.est').on('click',function()
        {
          marcar(this.id);
        })

        function iluminar(id)
        {
          let nro = parseInt(id[1])
          $('.est').attr('src','ev_b.png');
          for (i = 1; i <= nro; i++)
          {
            $('#e'+i).attr('src','ep_b.png');
          }
        }


        function marcar(id)
        {
          let nro = parseInt(id[1])
          
          for(i = 1; i <= nro; i++)
          {
            $('#e'+i).attr('src','ec_b.png')
          }

          acu += 1;
          conta += nro;

        }


        $('.est').on('mouseout',apagar);
        var prom = 0;
        function apagar()
        {
          $('.est').attr('src','ev_b.png');
          prom = conta / acu;

          // switch (prom)
          // {
          //   case (prom<=1):
          //   {
          //     $('#e1').attr('src','ec_b.png');
          //   }
          // }
          console.log(prom);
          if (prom <= 1) {
            $('#e1').attr('src','ec_b.png');
          }
          
          if (prom >= 1 && prom < 1.5) {
            $('#e1').attr('src','ec_b.png');
          } else if (prom >= 1.5 && prom < 2) {
            $('#e1').attr('src','ec_b.png');
            $('#e2').attr('src','em_b.png');
          }
          else if (prom>=2 && prom < 2.5)
          {
            $('#e1').attr('src','ec_b.png');
            $('#e2').attr('src','ec_b.png');
          }
          else if (prom>=2.5 && prom < 3)
          {
            $('#e1').attr('src','ec_b.png');
            $('#e2').attr('src','ec_b.png');
            $('#e3').attr('src','em_b.png');
          }
          else if (prom>=3 && prom < 3.5)
          {
            $('#e1').attr('src','ec_b.png');
            $('#e2').attr('src','ec_b.png');
            $('#e3').attr('src','ec_b.png');
          }
          else if (prom>=3.5 && prom < 4)
          {
            $('#e1').attr('src','ec_b.png');
            $('#e2').attr('src','ec_b.png');
            $('#e3').attr('src','ec_b.png');
            $('#e4').attr('src','em_b.png');
          }
          else if (prom>=4 && prom < 4.5)
          {
            $('#e1').attr('src','ec_b.png');
            $('#e2').attr('src','ec_b.png');
            $('#e3').attr('src','ec_b.png');
            $('#e4').attr('src','ec_b.png');
            

          }

          else if (prom>=4.5 && prom < 5)
          {
            $('#e1').attr('src','ec_b.png');
            $('#e2').attr('src','ec_b.png');
            $('#e3').attr('src','ec_b.png');
            $('#e4').attr('src','ec_b.png');
            $('#e5').attr('src','em_b.png');

          }

          else if (prom==5)
          {
            $('#e1').attr('src','ec_b.png');
            $('#e2').attr('src','ec_b.png');
            $('#e3').attr('src','ec_b.png');
            $('#e4').attr('src','ec_b.png');
            $('#e5').attr('src','ec_b.png');

          }


        }


      });

    </script>
  </body>
</html>
